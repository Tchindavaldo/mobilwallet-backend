# fly.toml — mobilwallet-backend
# Doc : https://fly.io/docs/reference/configuration/

app = 'mobilwallet-backend'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 7332          # l'app uvicorn écoute sur 7332 (cf. PORT)
  force_https = true
  # Machine TOUJOURS ALLUMÉE : jamais d'arrêt auto, au moins 1 machine en marche.
  # Pour l'éteindre/la rallumer sans redéployer : actions GitHub « Fly — allumer »
  # et « Fly — éteindre » (.github/workflows/fly-on.yml / fly-off.yml).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'                # Chromium (Playwright) a besoin de RAM
  cpu_kind = 'shared'
  cpus = 1
