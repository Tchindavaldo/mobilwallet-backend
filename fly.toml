# fly.toml — mobilwallet-backend
# Doc : https://fly.io/docs/reference/configuration/

app = 'mobilwallet-backend'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 7332          # l'app uvicorn écoute sur 7332 (cf. PORT)
  force_https = true
  # Machine volontairement ÉTEINTE : auto_start_machines=false + min_machines_running=0
  # pour que Fly NE relance PAS la machine sur trafic entrant. (Config normale "toujours
  # up" : auto_start_machines=true / min_machines_running=1 — à restaurer pour remettre
  # l'app en service.)
  auto_stop_machines = true
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'                # Chromium (Playwright) a besoin de RAM
  cpu_kind = 'shared'
  cpus = 1
