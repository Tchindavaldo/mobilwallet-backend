# fly.toml — mobilwallet-backend
# Doc : https://fly.io/docs/reference/configuration/

app = 'mobilwallet-backend'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 7332          # l'app uvicorn écoute sur 7332 (cf. PORT)
  force_https = true
  # Machine TOUJOURS UP (min_machines_running=1) : les connexions Socket.IO sont
  # persistantes (incompatibles avec un auto-stop), et le webhook DigiKUNTZ + le
  # polling /pay doivent rester joignables/vivants. auto_stop_machines reste true
  # pour arrêter UNIQUEMENT les machines en surplus si on scale > 1.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'                # Chromium (Playwright) a besoin de RAM
  cpu_kind = 'shared'
  cpus = 1
