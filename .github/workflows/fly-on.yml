# Allume la machine Fly : elle s'arrête seule sans trafic et redémarre à la 1re requête.
# Lancement : onglet Actions > « Fly — allumer (arrêt auto si inutilisé) » > Run workflow.
# Secret requis : FLY_API_TOKEN (fly tokens create deploy -a mobilwallet-backend).
name: Fly — allumer (arrêt auto si inutilisé)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Redéployer aussi le code de la branche choisie avant d'allumer"
        type: boolean
        default: false

concurrency: fly-machine-control

env:
  FLY_APP: mobilwallet-backend
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  on:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Déployer (optionnel)
        if: ${{ inputs.deploy }}
        run: flyctl deploy --remote-only -a "$FLY_APP"

      - name: Arrêt auto si inutilisé, démarrage auto au trafic, puis démarrer
        run: |
          ids=$(flyctl machine list -a "$FLY_APP" --json | jq -r '.[].id')
          if [ -z "$ids" ]; then echo "Aucune machine : lancer avec deploy=true." >&2; exit 1; fi
          for id in $ids; do
            flyctl machine update "$id" -a "$FLY_APP" --autostop=stop --autostart=true --yes
            flyctl machine start "$id" -a "$FLY_APP" || true
          done

      - name: État final
        run: flyctl machine list -a "$FLY_APP"
